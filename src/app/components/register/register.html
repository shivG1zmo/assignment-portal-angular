<div class="page">
  <div class="card">
    <h1 class="title">Assignment Portal</h1>
    <p class="subtitle">Create an account</p>

    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label>Name</label>
        <input type="text" [(ngModel)]="name" name="name" placeholder="Enter your name" required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Enter your password" required />
      </div>

      <div class="form-group">
        <label>Role</label>
        <select [(ngModel)]="role" name="role">
          <option value="student">Student</option>
          <option value="professor">Professor</option>
        </select>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>
    </form>

    <p class="switch">Already have an account? <a routerLink="/login">Login</a></p>
    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="success" *ngIf="successMessage">{{ successMessage }}</div>
  </div>
</div>
